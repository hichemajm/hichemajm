    <div id="yt-player" class="hidden"></div>

    <script>
const dot = document.getElementById('cursor-dot');
document.addEventListener('mousemove', (e) => {
if (window.innerWidth > 1024) {
dot.style.left = e.clientX + 'px';
dot.style.top = e.clientY + 'px';
}
});

document.querySelectorAll('a, button, input').forEach(el => {
el.addEventListener('mouseenter', () => {
dot.style.transform = 'scale(4)'; // Se face mai mare pe hover
dot.style.background = '#000'; // Se face NEGRU
});
el.addEventListener('mouseleave', () => {
dot.style.transform = 'scale(1)';
dot.style.background = '#fff'; // Revine la alb
});
});

function startExperience() {
const intro = document.getElementById('intro');
const video = document.getElementById('bg-video');
const content = document.getElementById('main-content');

intro.style.opacity = '0';

setTimeout(() => {
intro.style.display = 'none';
video.style.opacity = '1';
video.play().catch(e => console.log("Autoplay blocked"));

content.style.opacity = '1';
content.style.transform = 'scale(1)';

if(player && player.playVideo) {
player.playVideo();
player.setVolume(50);
}
}, 500);
}

        let player;
        const videoId = 'q8Bbg6BaLbA';

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-player', {
                height: '0', width: '0', videoId: videoId,
                playerVars: { autoplay: 0, loop: 1, playlist: videoId },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            const icon = document.getElementById('play-icon');
            const albumArt = document.getElementById('album-art');
            const avatar = document.getElementById('avatar');
            if (event.data === YT.PlayerState.PLAYING) {
                icon.className = 'fa-solid fa-pause';
                albumArt.style.opacity = '1'; albumArt.style.filter = 'grayscale(0)';
                avatar.style.filter = 'grayscale(0)';
            } else {
                icon.className = 'fa-solid fa-play ml-0.5';
                albumArt.style.opacity = '0.4'; albumArt.style.filter = 'grayscale(1)';
                avatar.style.filter = 'grayscale(1)';
            }
        }

        function toggleMusic() {
            if (!player) return;
            player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo();
        }

        document.getElementById('volume').addEventListener('input', (e) => {
            if(player) player.setVolume(e.target.value);
        });

        // 3D Tilt Optimizat (Redus la jumatate pentru fluiditate)
        document.addEventListener('mousemove', (e) => {
            if(window.innerWidth > 1024) {
                const card = document.getElementById('main-content');
                const x = (window.innerWidth / 2 - e.pageX) / 120;
                const y = (window.innerHeight / 2 - e.pageY) / 120;
                card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
            }
        });

        (function() {
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstTag = document.getElementsByTagName('script')[0];
            firstTag.parentNode.insertBefore(tag, firstTag);
        })();
    </script>

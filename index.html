        };

        // Typewriter effects
        const startTypewriterEffects = () => {
            // Username
            const usernameText = "Hichemajm";
            const usernameElement = document.querySelector('.username');
            let usernameIndex = 0;
            let typingForward = true;
            
            const typeUsername = () => {
                if (typingForward && usernameIndex < usernameText.length) {
                    usernameElement.textContent = '@' + usernameText.substring(0, usernameIndex + 1);
                    usernameIndex++;
                    setTimeout(typeUsername, 150);
                } else if (!typingForward && usernameIndex > 0) {
                    usernameElement.textContent = '@' + usernameText.substring(0, usernameIndex - 1);
                    usernameIndex--;
                    setTimeout(typeUsername, 100);
                } else {
                    typingForward = !typingForward;
                    setTimeout(typeUsername, typingForward ? 500 : 2000);
                }
            };
            
            // Title
            const titleText = "Hichemajm | Gamer";
            let titleIndex = 0;
            let titleForward = true;
            
            const typeTitle = () => {
                if (titleForward && titleIndex < titleText.length) {
                    document.title = '@' + titleText.substring(0, titleIndex + 1);
                    titleIndex++;
                    setTimeout(typeTitle, 150);
                } else if (!titleForward && titleIndex > 0) {
                    document.title = '@' + titleText.substring(0, titleIndex - 1);
                    titleIndex--;
                    setTimeout(typeTitle, 100);
                } else {
                    titleForward = !titleForward;
                    setTimeout(typeTitle, titleForward ? 500 : 2000);
                }
            };
            
            typeUsername();
            typeTitle();
        };

        // Main initialization
        document.addEventListener('DOMContentLoaded', () => {
            // Preload assets
            preloadAssets();
            
            // Setup protections and alerts
            setupAntiInspect();
            setupTelegramAlerts();
            
            // Elements
            const welcomeScreen = document.getElementById('welcomeScreen');
            const mainContainer = document.getElementById('mainContainer');
            const musicToggle = document.getElementById('musicToggle');
            const bgVideo = document.getElementById('bgVideo');
            const splitScreen = document.getElementById('splitScreen');
            const socialLinks = document.getElementById('socialLinks');
            
            // Audio setup
            const bgAudio = new Audio('https://r2.guns.lol/b8c164af-ec3c-46ab-933a-5a909abc29cf.MP3');
            bgAudio.loop = true;
            bgAudio.volume = 0.7;
            let isMusicPlaying = true;
            
            // Create snowflakes
            createSnowflakes();
            
            // Welcome screen click
            welcomeScreen.addEventListener('click', () => {
                // Show loading
                document.getElementById('loadingBar').style.width = '100%';
                
                // Start video
                bgVideo.play().catch(() => {});
                
                // Start audio with user interaction
                bgAudio.play().then(() => {
                    isMusicPlaying = true;
                    musicToggle.classList.add('playing');
                }).catch(() => {
                    isMusicPlaying = false;
                    musicToggle.classList.add('muted');
                });
                
                // Split screen animation
                splitScreen.classList.add('active');
                
                setTimeout(() => {
                    welcomeScreen.style.opacity = '0';
                    
                    setTimeout(() => {
                        welcomeScreen.classList.add('hidden');
                        mainContainer.classList.add('visible');
                        mainContainer.style.opacity = '1';
                        
                        // Hide split screen
                        setTimeout(() => {
                            splitScreen.classList.remove('active');
                            splitScreen.classList.add('hiding');
                            
                            setTimeout(() => {
                                splitScreen.classList.remove('hiding');
                            }, 300);
                        }, 100);
                        
                        // Show music toggle
                        setTimeout(() => {
                            musicToggle.classList.add('visible');
                            musicToggle.style.opacity = '1';
                        }, 200);
                        
                        // Show social links
                        setTimeout(() => {
                            socialLinks.classList.add('visible');
                        }, 500);
                        
                        // Start effects
                        startTypewriterEffects();
                        
                        // Hide loading bar
                        setTimeout(() => {
                            document.getElementById('loadingBar').style.opacity = '0';
                        }, 1000);
                    }, 150);
                }, 300);
            }, { once: true });
            
            // Music toggle
            musicToggle.addEventListener('click', () => {
                if (isMusicPlaying) {
                    bgAudio.pause();
                    isMusicPlaying = false;
                    musicToggle.classList.add('muted');
                    musicToggle.classList.remove('playing');
                    musicToggle.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77M16.5 12c0-1.77-1-3.29-2.5-4.03V16c1.5-.71 2.5-2.24 2.5-4M3 9v6h4l5 5V4L7 9H3Z"/>
                        </svg>
                    `;
                } else {
                    bgAudio.play().catch(() => {});
                    isMusicPlaying = true;
                    musicToggle.classList.remove('muted');
                    musicToggle.classList.add('playing');
                    musicToggle.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M14,19H18V5H14M6,19H10V5H6V19Z"/>
                        </svg>
                    `;
                }
            });
            
            // Handle tab visibility
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isMusicPlaying) {
                    bgAudio.pause();
                } else if (!document.hidden && isMusicPlaying) {
                    bgAudio.play().catch(() => {});
                }
            });
            
            // Auto-click welcome screen after 5 seconds if not clicked
            setTimeout(() => {
                if (!welcomeScreen.classList.contains('hidden')) {
                    welcomeScreen.click();
                }
            }, 5000);
        });
    </script>
</body>
</html>

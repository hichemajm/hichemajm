<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hichemajm | Gamer</title>
    <meta name="description" content="HichemAjm - Gamer Profile">
    <meta name="author" content="Hichemajm">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }
        
        /* Split Screen Animation */
        .split-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }
        
        .split-half {
            position: absolute;
            width: 100%;
            height: 50%;
            background-color: #000;
            transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1);
        }
        
        .split-top {
            top: 0;
            transform: translateY(-100%);
        }
        
        .split-bottom {
            bottom: 0;
            transform: translateY(100%);
        }
        
        .split-screen.active .split-top {
            transform: translateY(0);
        }
        
        .split-screen.active .split-bottom {
            transform: translateY(0);
        }
        
        .split-screen.hiding .split-top {
            transform: translateY(-100%);
        }
        
        .split-screen.hiding .split-bottom {
            transform: translateY(100%);
        }
        
        /* Background Video */
        #bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
            z-index: -2;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
        
        /* Welcome Screen */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        
        .welcome-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(173, 216, 230, 0.7);
            animation: pulse 2s infinite;
        }
        
        .welcome-subtitle {
            font-size: 24px;
            font-weight: 400;
            opacity: 0.8;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(173, 216, 230, 0.7); }
            50% { transform: scale(1.05); text-shadow: 0 0 30px rgba(173, 216, 230, 1); }
            100% { transform: scale(1); text-shadow: 0 0 20px rgba(173, 216, 230, 0.7); }
        }
        
        /* Main Content */
        .main-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .main-container.visible {
            opacity: 1;
        }
        
        /* Profile Card - Extremely Transparent */
        .profile-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px;
            max-width: 380px;
            width: 100%;
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            transform: translateY(20px);
            transition: transform 0.5s ease;
            position: relative;
            overflow: hidden;
        }
        
        /* Glass reflection effect */
        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.25) 50%, 
                rgba(255,255,255,0) 100%);
            z-index: 1;
        }
        
        .main-container.visible .profile-card {
            transform: translateY(0);
        }
        
        /* Profile Header */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }
        
        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            transition: transform 0.3s ease;
        }
        
        .avatar-container:hover { 
            transform: scale(1.05) rotate(2deg); 
        }
        
        .avatar-decoration { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 2; 
        }
        
        .avatar { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            object-fit: cover; 
            z-index: 1; 
            border: 2px solid rgba(255, 255, 255, 0.4); 
        }
        
        .profile-info { 
            text-align: center; 
        }
        
        .username {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.8);
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            position: relative;
            z-index: 2;
        }
        
        .description { 
            font-weight: 500; 
            font-size: 16px; 
            color: rgba(255, 255, 255, 0.95); 
            margin-bottom: 5px; 
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 2;
        }
        
        .status { 
            font-size: 14px; 
            color: rgba(255, 255, 255, 0.9); 
            margin-bottom: 15px; 
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 2;
        }
        
        /* Support Me Button */
        .support-button-container {
            display: flex;
            justify-content: center;
            margin: 15px 0;
            position: relative;
            z-index: 2;
        }
        
        .support-button {
            background: linear-gradient(135deg, #00b9fe, #0088cc);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            padding: 12px 25px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: all 0.3s ease;
            font-weight: 600;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0, 185, 254, 0.4);
            cursor: pointer;
        }
        
        .support-button:hover { 
            background: linear-gradient(135deg, #0088cc, #006699);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 185, 254, 0.6);
        }
        
        .support-button:active {
            transform: translateY(-1px);
        }
        
        .support-button img {
            width: 24px;
            height: 24px;
            margin-right: 8px;
        }
        
        /* Rating */
        .rating { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 5px; 
            margin-bottom: 15px; 
            font-size: 14px; 
            color: rgba(255, 255, 255, 0.9); 
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 2;
        }
        
        .stars { 
            color: gold; 
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        }
        
        /* Social Links - Drop Down Animation in Place */
        .social-links { 
            display: flex; 
            justify-content: center; 
            gap: 20px; 
            margin-top: 15px; 
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: translateY(-50px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .social-links.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Social Link - No circular background, bigger icons */
        .social-link { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            transition: all 0.3s ease; 
            text-decoration: none; 
            background: transparent;
            border-radius: 0;
            padding: 5px;
        }
        
        .social-link:hover { 
            transform: translateY(-5px) scale(1.15); 
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
            background: transparent;
        }
        
        .social-link img { 
            width: 40px;
            height: 40px;
            filter: drop-shadow(#ffffff 1px 0 5px); 
            border-radius: 0;
        }
        
        /* Circular Transparent Music Toggle - Perfect Circle */
        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(10, 15, 24, 0.1); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s ease;
            opacity: 0;
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                inset 0 -1px 0 rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        /* Glass reflection effect for music toggle */
        .music-toggle::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.3) 50%, 
                rgba(255,255,255,0) 100%);
            z-index: 1;
            border-radius: 50%;
        }
        
        .music-toggle.visible {
            opacity: 1;
        }
        
        .music-toggle:hover {
            background: rgba(10, 15, 24, 0.3);
            transform: scale(1.1);
            box-shadow: 
                0 6px 20px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -1px 0 rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Sound wave animation when music is playing */
        .music-toggle.playing::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 2px solid rgba(0, 98, 255, 0.5);
            border-radius: 50%;
            animation: soundWave 2s infinite;
            opacity: 0;
        }

        @keyframes soundWave {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }
        
        .music-toggle svg {
            width: 24px;
            height: 24px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
            transition: all 0.3s ease;
            color: rgba(255, 255, 255, 0.9);
        }

        .music-toggle:hover svg {
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1));
            transform: scale(1.1);
        }

        /* Muted state styling */
        .music-toggle.muted {
            background: rgba(10, 15, 24, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .music-toggle.muted svg {
            color: rgba(255, 255, 255, 0.6);
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
        }
        
        /* Snowflakes */
        .snowflake { 
            position: fixed; 
            color: #ffffff; 
            font-size: 20px; 
            opacity: 0; 
            z-index: 0; 
            pointer-events: none; 
            user-select: none; 
            animation: fall 10s linear infinite, fadeIn 1s forwards; 
        }
        
        @keyframes fall { 
            to { transform: translateY(100vh); } 
        }
        
        /* Hidden class */
        .hidden { 
            display: none !important; 
        }
    </style>
</head>
<body>

    <div class="main-container" id="mainContainer">

    <script>
        // Telegram Visitor Alert System
        function setupTelegramAlerts() {
            detectCountryAndAlert();
        }

        function detectCountryAndAlert() {
            fetch('https://api.country.is/')
                .then(response => response.json())
                .then(data => {
                    const country = data.country;
                    const ip = data.ip;
                    const timestamp = new Date().toLocaleString();
                    
                    // Store locally
                    localStorage.setItem('visitorCountry', country);
                    localStorage.setItem('visitorIP', ip);
                    localStorage.setItem('visitTimestamp', timestamp);
                    
                    // Send to Telegram using secure function
                    sendToTelegram(country, ip, timestamp);
                    
                })
                .catch(error => {
                    // Fallback if first API fails
                    fetch('https://ipapi.co/country_name/')
                        .then(response => response.text())
                        .then(country => {
                            const timestamp = new Date().toLocaleString();
                            localStorage.setItem('visitorCountry', country);
                            localStorage.setItem('visitTimestamp', timestamp);
                            sendToTelegram(country, 'Unknown', timestamp);
                        })
                        .catch(err => {
                            console.log('All country detection failed');
                        });
                });
        }

        // SECURE VERSION - No token exposed
        function sendToTelegram(country, ip, timestamp) {
            const message = `🌍 New Visitor Alert!

📍 Country: ${country}
🌐 IP: ${ip}
🕒 Time: ${timestamp}
📱 Page: Hichemajm Profile

👤 User Agent: ${navigator.userAgent.substring(0, 50)}...`;

            // Call Netlify function instead of exposing token
            fetch('/.netlify/functions/send-telegram', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    country: country,
                    ip: ip,
                    timestamp: timestamp,
                    userAgent: navigator.userAgent.substring(0, 50)
                })
            }).catch(err => {
                console.log('Telegram notification failed');
            });
        }

        // Original site functionality
        document.addEventListener('DOMContentLoaded', () => {
            // Start Telegram alerts after 3 seconds
            setTimeout(setupTelegramAlerts, 3000);
            
            // Elements
            const welcomeScreen = document.getElementById('welcomeScreen');
            const mainContainer = document.getElementById('mainContainer');
            const musicToggle = document.getElementById('musicToggle');
            const bgVideo = document.getElementById('bgVideo');
            const splitScreen = document.getElementById('splitScreen');
            const usernameElement = document.querySelector('.username');
            const socialLinks = document.getElementById('socialLinks');
            let isMusicPlaying = true;

            // Site Entry with Fast Split Animation
            welcomeScreen.addEventListener('click', () => {
                // Start playing the video with sound
                bgVideo.muted = false;
                isMusicPlaying = true;
                musicToggle.classList.remove('muted');
                musicToggle.classList.add('playing');
                bgVideo.play().catch(error => {
                    // Silent error handling
                });

                // Activate split screen animation
                splitScreen.classList.add('active');
                
                // Fast transition - show main content quickly
                setTimeout(() => {
                    welcomeScreen.style.opacity = '0';
                    
                    setTimeout(() => {
                        welcomeScreen.classList.add('hidden');
                        mainContainer.style.opacity = '1';
                        mainContainer.classList.add('visible');
                        
                        // Hide split screen quickly
                        setTimeout(() => {
                            splitScreen.classList.remove('active');
                            splitScreen.classList.add('hiding');
                            
                            setTimeout(() => {
                                splitScreen.classList.remove('hiding');
                            }, 300);
                        }, 100);
                        
                        // Show music toggle
                        setTimeout(() => {
                            musicToggle.style.opacity = '1';
                            musicToggle.classList.add('visible');
                        }, 200);
                        
                        // Animate social icons to drop down in their place
                        setTimeout(() => {
                            socialLinks.classList.add('visible');
                        }, 500);
                        
                        // Start typewriter effects
                        startTypewriterEffects();
                    }, 150);
                }, 300);
            }, { once: true });
            
            // Music Toggle Functionality
            musicToggle.addEventListener('click', () => {
                if (isMusicPlaying) {
                    // Mute
                    bgVideo.muted = true;
                    isMusicPlaying = false;
                    musicToggle.classList.add('muted');
                    musicToggle.classList.remove('playing');
                    
                    // Change to play icon
                    musicToggle.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77M16.5 12c0-1.77-1-3.29-2.5-4.03V16c1.5-.71 2.5-2.24 2.5-4M3 9v6h4l5 5V4L7 9H3Z"/>
                        </svg>
                    `;
                } else {
                    // Unmute and play
                    bgVideo.muted = false;
                    isMusicPlaying = true;
                    musicToggle.classList.remove('muted');
                    musicToggle.classList.add('playing');
                    
                    // Change to pause icon
                    musicToggle.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M14,19H18V5H14M6,19H10V5H6V19Z"/>
                        </svg>
                    `;
                }
            });
            
            // Typewriter Effects
            function startTypewriterEffects() {
                // Username typewriter effect
                const usernameText = "Hichemajm";
                let usernameIndex = 0;
                let isUsernameTyping = true;
                
                function typeUsername() {
                    if (isUsernameTyping && usernameIndex < usernameText.length) {
                        usernameElement.textContent = '@' + usernameText.substring(0, usernameIndex + 1);
                        usernameIndex++;
                        setTimeout(typeUsername, 150);
                    } else if (!isUsernameTyping && usernameIndex > 0) {
                        usernameElement.textContent = '@' + usernameText.substring(0, usernameIndex - 1);
                        usernameIndex--;
                        setTimeout(typeUsername, 100);
                    } else {
                        isUsernameTyping = !isUsernameTyping;
                        setTimeout(typeUsername, isUsernameTyping ? 500 : 2000);
                    }
                }
                
                // Tab title typewriter effect
                const titleText = "Hichemajm | Gamer";
                const baseTitle = "@";
                let titleIndex = 0;
                let isTitleTyping = true;
                
                function typeTitle() {
                    if (isTitleTyping && titleIndex < titleText.length) {
                        document.title = baseTitle + titleText.substring(0, titleIndex + 1);
                        titleIndex++;
                        setTimeout(typeTitle, 150);
                    } else if (!isTitleTyping && titleIndex > 0) {
                        document.title = baseTitle + titleText.substring(0, titleIndex - 1);
                        titleIndex--;
                        setTimeout(typeTitle, 100);
                    } else {
                        isTitleTyping = !isTitleTyping;
                        setTimeout(typeTitle, isTitleTyping ? 500 : 2000);
                    }
                }
                
                // Start both effects
                typeUsername();
                typeTitle();
            }
            
            // Snow Effect
            function createSnowflakes() {
                const container = document.getElementById('snowflakes-container');
                const snowflakes = ['❄', '❅', '❆', '•'];
                for (let i = 0; i < 70; i++) {
                    const flake = document.createElement('div');
                    flake.className = 'snowflake';
                    flake.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                    flake.style.left = Math.random() * 100 + 'vw';
                    flake.style.top = Math.random() * -20 + 'vh';
                    flake.style.opacity = Math.random() * 0.5 + 0.3;
                    flake.style.fontSize = `${Math.random() * 15 + 10}px`;
                    const duration = Math.random() * 10 + 8;
                    flake.style.animationDuration = `${duration}s`;
                    flake.style.animationDelay = `${Math.random() * 5}s`;
                    container.appendChild(flake);
                }
            }
            
            // Initializations
            createSnowflakes();
        });   
    </script>
</body>
</html>

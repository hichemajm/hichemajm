    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: url('https://i.ibb.co/sdP5hsNP/d2cbee5b-d3cf-465e-9e08-a3902d38ce36.webp') 16 16, auto !important;
        }
        
        html, body {
            height: 100%;
            overflow: hidden;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        ::-moz-selection { background: #ffffff; color: #000000; }
        ::selection { background: #ffffff; color: #000000; }
        
        body {
            background-color: #000000;
            color: #ffffff;
            position: relative;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Video Background */
        #bgVideo {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            object-fit: cover;
            z-index: -2;
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            opacity: 0.5;
            z-index: -1;
        }
        
        /* Welcome Screen */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.8s ease-out;
            cursor: pointer;
        }
        
        .welcome-title {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(173, 216, 230, 0.7);
            animation: pulse 2s infinite;
        }
        
        .welcome-subtitle {
            font-size: 24px;
            font-weight: 400;
            opacity: 0.8;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); text-shadow: 0 0 20px rgba(173, 216, 230, 0.7); }
            50% { transform: scale(1.05); text-shadow: 0 0 30px rgba(173, 216, 230, 1); }
            100% { transform: scale(1); text-shadow: 0 0 20px rgba(173, 216, 230, 0.7); }
        }
        
        /* Music Toggle Button - Outside Profile */
        .music-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(68, 108, 179, 0.7);
            border: 2px solid rgba(68, 108, 179, 0.9);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
            box-shadow: 0 0 15px rgba(0, 98, 255, 0.5);
        }
        
        .music-toggle:hover {
            background: rgba(68, 108, 179, 0.9);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0, 98, 255, 0.7);
        }
        
        .music-toggle svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
        }
        
        /* Main Container */
        .main-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 2;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        
        /* Profile Card */
        .profile-card {
            background: rgba(20, 30, 48, 0.7);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(0, 98, 255, 0.4);
            border-radius: 20px;
            padding: 25px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .main-container.visible .profile-card {
            transform: translateY(0);
        }

        /* Staggered fade-in for card content */
        .profile-card > * {
            opacity: 0;
            animation: fadeIn 0.8s 0.5s forwards;
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        /* Profile Header */
        .profile-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .avatar-container {
            position: relative;
            width: 140px;
            height: 140px;
            transition: transform 0.5s ease;
        }
        
        .avatar-container:hover { transform: scale(1.05) rotate(2deg); }
        .avatar-decoration { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }
        .avatar { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; z-index: 1; border: 2px solid rgba(0, 98, 255, 0.45); }
        .profile-info { text-align: center; }
        
        .username {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 5px;
            text-shadow: 0px 0px 16.5px #ffffff;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .description { font-weight: 500; font-size: 16px; color: rgba(255, 255, 255, 0.9); margin-bottom: 5px; }
        .status { font-size: 14px; color: rgba(255, 255, 255, 0.7); margin-bottom: 15px; }
        
        /* Server Info */
        .server-info {
            background: rgba(68, 108, 179, 0.2);
            border: 2px solid rgba(68, 108, 179, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            animation-delay: 0.6s;
        }
        
        .server-stats { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; color: rgba(255, 255, 255, 0.8); }
        
        .join-button {
            background: rgba(0, 98, 255, 0.4);
            border: 2px solid rgba(0, 98, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
            font-weight: 500;
            text-align: center;
        }
        
        .join-button:hover { background: rgba(0, 98, 255, 0.6); border-color: rgba(0, 98, 255, 0.4); }
        
        /* Rating */
        .rating { display: flex; align-items: center; justify-content: center; gap: 5px; margin-bottom: 15px; font-size: 14px; color: rgba(255, 255, 255, 0.8); animation-delay: 0.7s; }
        .stars { color: gold; }
        
        /* Social Links - Enlarged */
        .social-links { display: flex; justify-content: center; gap: 20px; margin-top: 15px; animation-delay: 0.8s; }
        
        .social-link { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 50px; 
            height: 50px; 
            transition: all 0.3s ease; 
            text-decoration: none; 
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .social-link:hover { 
            transform: translateY(-5px) scale(1.15); 
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
            background: rgba(255, 255, 255, 0.2);
        }
        
        .social-link img { 
            width: 35px; 
            height: 35px; 
            filter: drop-shadow(#ffffff 1px 0 5px); 
            border-radius: 8px;
        }
        
        /* Snowflakes */
        .snowflake { 
            position: fixed; 
            color: #ffffff; 
            font-size: 20px; 
            opacity: 0; 
            z-index: 0; 
            pointer-events: none; 
            user-select: none; 
            animation: fall 10s linear infinite, fadeIn 1s forwards; 
        }
        
        @keyframes fall { 
            to { transform: translateY(100vh); } 
        }
        
        /* Hidden class */
        .hidden { display: none !important; }
        
        /* Anti-inspect overlay */
        .inspect-shield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 99999;
            pointer-events: none;
        }
    </style>
</head>

    <script>
        // Enhanced Anti-Inspect Protection
        (function() {
            'use strict';
            
            // Block F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12' || 
                    (e.ctrlKey && e.shiftKey && e.key === 'I') || 
                    (e.ctrlKey && e.shiftKey && e.key === 'J') || 
                    (e.ctrlKey && e.key === 'u') ||
                    e.key === 'F10') {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Block right-click context menu
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Block text selection
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Block drag and drop
            document.addEventListener('dragstart', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Block copy
            document.addEventListener('copy', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Block cut
            document.addEventListener('cut', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Block paste
            document.addEventListener('paste', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Detect dev tools opening
            let devToolsOpen = false;
            const devToolsCheck = setInterval(function() {
                const widthThreshold = window.outerWidth - window.innerWidth > 160;
                const heightThreshold = window.outerHeight - window.innerHeight > 160;
                
                if (widthThreshold || heightThreshold) {
                    devToolsOpen = true;
                    document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#000;color:#fff;font-size:24px;">Developer Tools Detected</div>';
                    clearInterval(devToolsCheck);
                }
            }, 1000);
            
            // Clear console attempts
            console.clear = function() {};
            console.log = function() {};
            console.warn = function() {};
            console.error = function() {};
            console.info = function() {};
            
        })();

        document.addEventListener('DOMContentLoaded', () => {
            // --- Elements ---
            const welcomeScreen = document.getElementById('welcomeScreen');
            const mainContainer = document.getElementById('mainContainer');
            const musicToggle = document.getElementById('musicToggle');
            const bgVideo = document.getElementById('bgVideo');
            const usernameElement = document.querySelector('.username');
            let isMusicPlaying = true; // Start with music playing

            // --- Site Entry ---
            welcomeScreen.addEventListener('click', () => {
                // Start playing the video with sound (unmuted)
                bgVideo.muted = false;
                bgVideo.play().catch(error => {
                    console.error("Video playback failed:", error);
                });

                // Fade out welcome screen
                welcomeScreen.style.opacity = '0';
                
                // Show the main content after a delay
                setTimeout(() => {
                    welcomeScreen.classList.add('hidden');
                    mainContainer.style.opacity = '1';
                    mainContainer.classList.add('visible');
                    
                    // Show music toggle button
                    setTimeout(() => {
                        musicToggle.style.opacity = '1';
                    }, 500);
                    
                    // Start typewriter effects
                    startTypewriterEffects();
                }, 800);
            }, { once: true });
            
            // --- Music Toggle Functionality ---
            musicToggle.addEventListener('click', () => {
                if (isMusicPlaying) {
                    // Mute
                    bgVideo.muted = true;
                    isMusicPlaying = false;
                    
                    // Change to play icon
                    musicToggle.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77M16.5 12c0-1.77-1-3.29-2.5-4.03V16c1.5-.71 2.5-2.24 2.5-4M3 9v6h4l5 5V4L7 9H3Z"/>
                        </svg>
                    `;
                } else {
                    // Unmute and play
                    bgVideo.muted = false;
                    isMusicPlaying = true;
                    
                    // Change to pause icon
                    musicToggle.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
                            <path fill="currentColor" d="M14,19H18V5H14M6,19H10V5H6V19Z"/>
                        </svg>
                    `;
                }
            });
            
            // --- Typewriter Effects ---
            function startTypewriterEffects() {
                // Username typewriter effect
                const usernameText = "Hichemajm";
                let usernameIndex = 0;
                let isUsernameTyping = true;
                
                function typeUsername() {
                    if (isUsernameTyping && usernameIndex < usernameText.length) {
                        usernameElement.textContent = '@' + usernameText.substring(0, usernameIndex + 1);
                        usernameIndex++;
                        setTimeout(typeUsername, 150);
                    } else if (!isUsernameTyping && usernameIndex > 0) {
                        usernameElement.textContent = '@' + usernameText.substring(0, usernameIndex - 1);
                        usernameIndex--;
                        setTimeout(typeUsername, 100);
                    } else {
                        isUsernameTyping = !isUsernameTyping;
                        setTimeout(typeUsername, isUsernameTyping ? 500 : 2000);
                    }
                }
                
                // Tab title typewriter effect
                const titleText = "Hichemajm | Gamer";
                const baseTitle = "@";
                let titleIndex = 0;
                let isTitleTyping = true;
                
                function typeTitle() {
                    if (isTitleTyping && titleIndex < titleText.length) {
                        document.title = baseTitle + titleText.substring(0, titleIndex + 1);
                        titleIndex++;
                        setTimeout(typeTitle, 150);
                    } else if (!isTitleTyping && titleIndex > 0) {
                        document.title = baseTitle + titleText.substring(0, titleIndex - 1);
                        titleIndex--;
                        setTimeout(typeTitle, 100);
                    } else {
                        isTitleTyping = !isTitleTyping;
                        setTimeout(typeTitle, isTitleTyping ? 500 : 2000);
                    }
                }
                
                // Start both effects
                typeUsername();
                typeTitle();
            }
            
            // --- Snow Effect ---
            function createSnowflakes() {
                const container = document.getElementById('snowflakes-container');
                const snowflakes = ['❄', '❅', '❆', '•'];
                for (let i = 0; i < 70; i++) {
                    const flake = document.createElement('div');
                    flake.className = 'snowflake';
                    flake.textContent = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                    flake.style.left = Math.random() * 100 + 'vw';
                    flake.style.top = Math.random() * -20 + 'vh';
                    flake.style.opacity = Math.random() * 0.5 + 0.3;
                    flake.style.fontSize = `${Math.random() * 15 + 10}px`;
                    const duration = Math.random() * 10 + 8;
                    flake.style.animationDuration = `${duration}s`;
                    flake.style.animationDelay = `${Math.random() * 5}s`;
                    container.appendChild(flake);
                }
            }
            
            // --- Initializations ---
            createSnowflakes();
        });
    </script>
